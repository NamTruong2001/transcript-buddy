services:
  edge-api:
    build:
      context: ./apps/edge-api
    restart: unless-stopped
    environment:
      AGENT_URL: ${AGENT_URL:-ws://100.65.100.110:8100/ws}
      AGENT_TOKEN: ${AGENT_TOKEN:-dev-agent-token-change-me}
      EDGE_HOST: 0.0.0.0
      EDGE_PORT: "8000"
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "8010:8000"

  frontend:
    build:
      context: ./apps/frontend
      args:
        VITE_EDGE_URL: ""
    restart: unless-stopped
    ports:
      - "5180:80"
    depends_on:
      - edge-api
